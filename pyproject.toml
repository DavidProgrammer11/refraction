[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refraccion"
dynamic = ["version"]
description = "Refracción: la ley de Snell explicada y dibujada"
requires-python = ">=3.10"
authors = [{ name = "DZM" }]
dependencies = [
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-qt>=4.4",
    "hypothesis>=6.100",
    "pyinstaller>=6",
]

[project.gui-scripts]
refraccion = "refraccion.app:main"

[tool.setuptools.dynamic]
version = { attr = "refraccion.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"refraccion" = ["resources/*", "resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
